// ==========================================
//  JavaScript — แปลงข้อมูลและจัดตำแหน่งพิมพ์

function formatNum(n) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ฟังก์ชันแปลงตัวเลขเป็นตัวอักษรภาษาไทย (=BAHTTEXT ใน Google Sheets)
function convertToThaiBaht(num) {
  if (num === null || num === undefined || isNaN(num)) return '';
  num = parseFloat(num).toFixed(2);
  if (num === '0.00') return 'ศูนย์บาทถ้วน';

  const numbers = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
  const digits  = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน'];

  const parts = num.split('.');
  const integerPart = parts[0];
  const decimalPart = parts[1];

  function convertSection(s) {
    let res = '';
    const len = s.length;
    for (let i = 0; i < len; i++) {
      const d = parseInt(s[i], 10);
      const pos = len - i - 1;
      if (d !== 0) {
        if (pos === 0 && d === 1 && len > 1) {
          res += 'เอ็ด';
        } else if (pos === 1 && d === 1) {
          res += 'สิบ';
        } else if (pos === 1 && d === 2) {
          res += 'ยี่สิบ';
        } else {
          res += numbers[d] + digits[pos];
        }
      }
    }
    return res;
  }

  let res = '';
  const intLen = integerPart.length;
  if (intLen > 6) {
    const milPart = integerPart.substring(0, intLen - 6);
    const lowPart = integerPart.substring(intLen - 6);
    res = convertSection(milPart) + 'ล้าน' + convertSection(lowPart);
  } else {
    res = convertSection(integerPart);
  }
  res += 'บาท';

  if (decimalPart === '00') {
    res += 'ถ้วน';
  } else {
    let decRes = '';
    const d1 = parseInt(decimalPart[0], 10);
    const d2 = parseInt(decimalPart[1], 10);
    if (d1 !== 0) {
      if (d1 === 1) decRes += 'สิบ';
      else if (d1 === 2) decRes += 'ยี่สิบ';
      else decRes += numbers[d1] + 'สิบ';
    }
    if (d2 !== 0) {
      if (d2 === 1 && d1 !== 0) decRes += 'เอ็ด';
      else decRes += numbers[d2];
    }
    res += decRes + 'สตางค์';
  }
  return res;
}

// จัดรูปแบบวันที่ เช่น 5/09/2026 ตามตัวอย่างของผู้ใช้
function formatDocDate(dStr) {
  if (!dStr) return '';
  const parts = String(dStr).split('-');
  if (parts.length === 3) {
    const y = parts[0], m = parts[1], d = parts[2];
    return `${parseInt(d, 10)}/${m}/${y}`;
  }
  return String(dStr);
}

window.onload = function() {
  let data = {};

  // 1. อ่านข้อมูลจาก JSON script tag
  try {
    const scriptEl = document.getElementById('invoiceDataScript');
    if (scriptEl && scriptEl.textContent.trim()) {
      data = JSON.parse(scriptEl.textContent.trim());
    }
  } catch(e) {
    console.warn('Parse script tag error:', e);
  }

  // 2. ถ้าไม่มี ให้อ่านจาก URL
  if (!data || !data.customerName) {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const raw = urlParams.get('data');
      if (raw) data = JSON.parse(decodeURIComponent(raw));
    } catch(e2) {
      console.warn('Parse URL error:', e2);
    }
  }

  // ★ ตรวจสอบว่ามีข้อมูลจริงไหม ถ้าไม่มีให้แจ้งเตือนแทนปล่อยหน้าขาว
  if (!data || !data.customerName) {
    document.getElementById('invoicePage').innerHTML =
      '<div style="padding:60px 24px;text-align:center;font-size:18px;color:#c00;line-height:1.8;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);margin:40px auto;max-width:600px;">' +
      '⚠️ <strong>ไม่พบข้อมูลใบกำกับภาษี</strong><br><br>' +
      'กรุณาเปิดหน้านี้ผ่านปุ่ม <strong>"บันทึก & พิมพ์ / ดาวน์โหลด PDF"</strong> จากหน้าเว็บแอปหลักเท่านั้น<br>' +
      '<span style="font-size:14px;color:#666;">(ไม่สามารถเปิดไฟล์นี้โดยตรงได้ เพราะต้องรับข้อมูลที่ส่งมาจากระบบ)</span>' +
      '</div>';
    return; // หยุดทำงาน ไม่ต้องพิมพ์หรือประมวลผลต่อ
  }

  // หยอดข้อมูลลูกค้าและเอกสาร
  document.getElementById('pCustName').textContent = data.customerName || '';
  document.getElementById('pAddress1').textContent = data.customerAddress1 || '';
  document.getElementById('pAddress2').textContent = data.customerAddress2 || '';
  document.getElementById('pDate').textContent     = formatDocDate(data.invoiceDate);
  document.getElementById('pTaxId').textContent    = data.customerTaxId || '';
  document.getElementById('pInvNo').textContent    = data.invoiceNo || '';
  document.getElementById('pCustCode').textContent = data.customerCustNo || '';

  // หยอดรายการสินค้า 13 แถว (Row 1 ถึง 13)
  const items = data.items || [];
  for (let i = 1; i <= 13; i++) {
    const tr = document.getElementById('row_' + i);
    if (!tr) continue;
    const item = items[i - 1] || null;

    if (item && item.name) {
      tr.querySelector('.num').textContent    = i;
      tr.querySelector('.name').textContent   = item.name;
      tr.querySelector('.qty').textContent    = item.qty ? (typeof item.qty === 'number' ? item.qty : item.qty) : '';
      tr.querySelector('.unit').textContent   = item.unit || '';
      tr.querySelector('.price').textContent  = item.price ? formatNum(item.price) : '';
      tr.querySelector('.amount').textContent = item.total ? formatNum(item.total) : '';
    } else {
      // แถวว่าง
      tr.querySelector('.num').textContent    = '';
      tr.querySelector('.name').textContent   = '';
      tr.querySelector('.qty').textContent    = '';
      tr.querySelector('.unit').textContent   = '';
      tr.querySelector('.price').textContent  = '';
      tr.querySelector('.amount').textContent = '';
    }
  }

  // สรุปยอดเงิน
  const subtotal = data.subtotal || 0;
  const vat = data.vat || 0;
  const grandTotal = data.grandTotal || 0;

  document.getElementById('pSubtotal').textContent   = formatNum(subtotal);
  document.getElementById('pVat').textContent        = formatNum(vat);
  document.getElementById('pGrandTotal').textContent = formatNum(grandTotal);
  document.getElementById('pBahtText').textContent   = convertToThaiBaht(grandTotal);

  // เรียกคำสั่งพิมพ์อัตโนมัติ (เปิดหน้าต่าง print dialog ทันที)
  setTimeout(function() {
    window.print();
  }, 600);
};

// ดาวน์โหลดเป็น PDF สำหรับเครื่อง PC
function downloadPdfDirectly() {
  const btn = (typeof event !== 'undefined' && event && event.target) ? (event.target.closest('button') || event.target) : null;
  const origText = btn ? btn.innerHTML : '📥 บันทึกเป็น PDF ลงเครื่อง PC';
  if (btn) {
    btn.innerHTML = '⏳ กำลังสร้าง PDF...';
    btn.disabled = true;
  }

  const runDownload = function() {
    const element = document.getElementById('invoicePage');
    const invNo = (document.getElementById('pInvNo').textContent || 'Invoice').trim();
    const cleanInvNo = invNo.replace(/[^a-zA-Z0-9ก-๙\-_]/g, '_');

    const opt = {
      margin:       0,
      filename:     cleanInvNo + '.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { 
        scale: 2, 
        useCORS: true, 
        width: 764,
        scrollX: 0,
        scrollY: 0
      },
      jsPDF:        { unit: 'px', format: [764, 1080], orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
      if (btn) {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }).catch(err => {
      alert('เกิดข้อผิดพลาดในการสร้าง PDF: ' + err);
      if (btn) {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    });
  };

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(runDownload);
  } else {
    runDownload();
  }
}

// ปิดหน้าต่างพิมพ์ หรือกลับหน้าหลักถ้าเบราว์เซอร์บล็อค window.close()
function closePrintPage() {
  try { window.close(); } catch(e) {}
  try { window.open('', '_self', ''); window.close(); } catch(e) {}

  setTimeout(function() {
    if (!window.closed) {
      const baseUrl = window.location.href.split('?')[0];
      if (confirm('เบราว์เซอร์บล็อคการปิดแท็บอัตโนมัติ (ระบบความปลอดภัยของเบราว์เซอร์)\n\nกด "ตกลง" เพื่อกลับไปยังหน้าหลัก หรือกดปิดเครื่องหมาย ✕ ที่หัวแท็บด้านบนของเบราว์เซอร์')) {
        window.location.href = baseUrl;
      }
    }
  }, 250);
}

// กลับไปยังหน้าหลักของ Web App
function backToMainApp() {
  const baseUrl = window.location.href.split('?')[0];
  window.location.href = baseUrl;
}
